# MAISON LUMIÈRE — build the Vite site and publish it to the gh-pages branch
# (GitHub Pages serves that branch at
#  https://youssoufdaldoul-byte.github.io/Antonio-Salvator-/)
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/maison-lumiere-website-dfkxg1]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        working-directory: website
        run: npm ci
      - name: Build (served under /Antonio-Salvator-/)
        working-directory: website
        run: npm run build -- --base=/Antonio-Salvator-/
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: website/dist
          publish_branch: gh-pages
          force_orphan: true
